appId: com.axzydev.puertonuevoapp
---
- runFlow: ../login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-tickets"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-tickets"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-tablero"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-tablero"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/08-tickets-tablero
