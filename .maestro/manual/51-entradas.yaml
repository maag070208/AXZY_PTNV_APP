appId: com.axzydev.puertonuevoapp
---
- runFlow: ../login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-reloj-y-horarios"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-reloj-y-horarios"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-entradas-y-salidas"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-entradas-y-salidas"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/28-entradas-salidas
