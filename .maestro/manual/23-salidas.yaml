appId: com.axzydev.puertonuevoapp
---
- runFlow: ../login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-inventario"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-inventario"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-salidas-de-material"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-salidas-de-material"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/16-salidas-material
