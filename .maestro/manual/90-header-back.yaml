appId: com.axzydev.puertonuevoapp
---
- runFlow: ../login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-configuracion"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-configuracion"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-usuarios"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-usuarios"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/92-usuarios-header-back
- tapOn: "Atrás"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/93-home-header-drawer
