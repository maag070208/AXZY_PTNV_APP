appId: com.axzydev.puertonuevoapp
---
- runFlow: ../login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-configuracion"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-configuracion"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-relojes"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-relojes"
- waitForAnimationToEnd
- takeScreenshot: screenshots/2026-10-30/21-relojes
