# Reportes: carga de la pantalla con sus pestañas y export.
appId: com.axzydev.puertonuevoapp
---
- runFlow: login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "drawer-node-inventario"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-reportes"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-reportes"
- extendedWaitUntil:
    visible: "Asignados"
    timeout: 20000
