# Horarios: lista y asignación (solo carga de pantallas).
appId: com.axzydev.puertonuevoapp
---
- runFlow: login.yaml
- tapOn: "Menú"
- hideKeyboard
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-node-reloj-y-horarios"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-node-reloj-y-horarios"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "drawer-child-horarios"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "drawer-child-horarios"
- extendedWaitUntil:
    visible: "Horarios"
    timeout: 15000
